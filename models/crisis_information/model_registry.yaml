    test_split: 955
    seed: 42
    preprocessing_version: "clean_crisis_text_v1"
    metrics:
      accuracy: 0.7445
      macro_precision: 0.5915
      macro_recall: 0.6584
      macro_f1: 0.6171
      weighted_f1: 0.7501
    calibration_status: "UNCALIBRATED"
    checkpoint: "models/crisis_information/crisismmd/crisismmd_baseline_logistic.joblib"
    limitations:
      - "Text-only model; local images are unavailable (image_available_locally = False)."
      - "Evaluates in-distribution split with event overlap across partitions."

