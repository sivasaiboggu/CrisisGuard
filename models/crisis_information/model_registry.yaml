    seed: 42
    preprocessing_version: "humaid_id_split_v1"
    metrics:
      accuracy: 0.1497
      macro_precision: 0.0984
      macro_recall: 0.0985
      macro_f1: 0.0984
      weighted_f1: 0.1492
