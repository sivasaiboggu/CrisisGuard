dataset: "osm"
official_name: "OpenStreetMap Regional Road Network (Geofabrik Extract)"
role: "Physical infrastructure graph modeling, road network connectivity, emergency dispatch reachability, and shortest-path calculation in GraphX."
source_url: "https://download.geofabrik.de/asia/maldives-latest.osm.pbf"
organization: "Geofabrik GmbH & OpenStreetMap Contributors"
access_status: "AVAILABLE"
license: "Open Database License (ODbL) 1.0"
terms_url: "https://www.openstreetmap.org/copyright"
download_method: "Direct automated HTTP download of regional PBF extract from Geofabrik mirror into data/raw/osm/regional_extract.osm.pbf"
expected_formats:
  - ".osm.pbf"
  - ".csv"
  - ".parquet"
expected_size: "3.64 MB (.osm.pbf)"
local_storage_plan: "Controlled regional extract stored in data/raw/osm/regional_extract.osm.pbf."
selected_subset: "Regional road network extract covering primary, secondary, and tertiary emergency transit corridors."
selection_reason: "Provides complete, self-contained road network topology for GraphX routing algorithms while remaining lightweight (3.6 MB), avoiding massive 10 GB graph memory thrashing."
raw_data_policy: "Store unmodified `.osm.pbf` in data/raw/osm/."
derived_data_policy: "Extracted road nodes (`node_id`, `lat`, `lon`), edges (`source`, `target`, `length_km`, `road_type`), and distance matrices stored in data/processed/osm/ and data/features/osm/."
validation_status: "VALIDATED"
checksum_policy: "MD5 verified against Geofabrik release file."
notes: "Pure infrastructure topology source; does not provide emergency incident ground truth."
