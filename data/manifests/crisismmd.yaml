dataset: "crisismmd"
official_name: "CrisisMMD: Multimodal Twitter Dataset for Crisis Response and Damage Assessment"
role: "Multimodal crisis event analysis, cross-modal text-image consistency validation, and visual physical damage severity estimation."
source_url: "https://crisiscomputing.qcri.org/crisismmd"
organization: "Qatar Computing Research Institute (QCRI / Alam et al., ICWSM 2018)"
access_status: "AVAILABLE"
license: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
terms_url: "https://crisiscomputing.qcri.org/crisismmd"
download_method: "Direct automated HTTP download of official annotation tables from QCRI; controlled download of sampled crisis images."
expected_formats:
  - ".tsv"
  - ".jpg"
  - ".png"
expected_size: "15 MB (Annotations: 16,087 multimodal records), ~2.0 GB (Sampled crisis imagery)"
local_storage_plan: "Complete annotation tables and controlled sample of damage-annotated images (200 images, ~150 MB) stored in data/raw/crisismmd/."
selected_subset: "Full annotation tables + stratified sample of 200 crisis images representing `severe_damage`, `mild_damage`, and `little_or_no_damage`."
selection_reason: "Provides direct empirical evidence for multimodal crisis prioritization without exhausting local bandwidth or storage."
raw_data_policy: "Store unmodified TSVs and original JPGs in data/raw/crisismmd/."
derived_data_policy: "Visual damage category vectors and cross-modal consistency flags stored in data/features/crisismmd/."
validation_status: "AVAILABLE"
checksum_policy: "SHA256 verified against QCRI data distribution."
notes: "Primary multimodal crisis benchmark for natural disasters (Hurricane Irma, Mexico Earthquake, California Wildfires)."
