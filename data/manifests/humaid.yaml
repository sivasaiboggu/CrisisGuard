dataset: "humaid"
official_name: "HumAID: Human-Annotated Disaster Incidents Dataset"
role: "Crisis text classification, emergency urgency feature extraction, and humanitarian aid task prioritization."
source_url: "https://crisisnlp.qcri.org/humaid_dataset.html"
organization: "Qatar Computing Research Institute (QCRI / Imran et al., ICWSM 2021)"
access_status: "AVAILABLE"
license: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
terms_url: "https://github.com/qcri/HumAID/blob/main/LICENSE"
download_method: "Direct automated Git clone / HTTP download from official QCRI HumAID GitHub repository (`https://github.com/qcri/HumAID.git`)."
expected_formats:
  - ".tsv"
  - ".csv"
expected_size: "25 MB (Complete corpus: 77,196 human-labeled tweets across 19 disaster events from 2016 to 2019)"
local_storage_plan: "Complete raw repository stored in data/raw/humaid/."
selected_subset: "Full dataset utilized across all 19 crisis events (wildfires, earthquakes, hurricanes, floods)."
selection_reason: "Dataset is lightweight (25 MB) and provides gold-standard humanitarian categorical labels (`rescue_volunteering_effort`, `infrastructure_and_utility_damage`, `caution_and_advice`, `injured_or_dead_people`)."
raw_data_policy: "Store unmodified TSV files in data/raw/humaid/. Zero in-place edits."
derived_data_policy: "Tokenized text features, TF-IDF vectors, urgency score embeddings stored in data/features/humaid/."
validation_status: "AVAILABLE"
checksum_policy: "SHA256 verified against QCRI release commit `c5f2b84`."
notes: "100% open-access, reproducible research benchmark with human consensus labels."
