dataset: "propagation"
official_name: "CrisisGuard Semi-Synthetic Propagation Cascade Dataset"
role: "Simulate information diffusion, retweet/repost cascades, bot amplification, and viral spread of synthetic media during crises for Kafka streaming and GraphX network analysis."
source_url: "Local CrisisGuard Generator (`src/propagation/generator.py`)"
organization: "CrisisGuard Research Project (Author: B.SIVASAI, Roll No: 2023BCS0228, CSE412)"
access_status: "AVAILABLE"
license: "MIT License (CrisisGuard Project Component)"
terms_url: "Local Project Repository"
