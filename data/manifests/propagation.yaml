expected_formats:
  - ".jsonl"
  - ".csv"
  - ".parquet"
expected_size: "50 MB - 100 MB (~50,000 to 200,000 propagation events & edges)"
local_storage_plan: "Stored strictly in data/generated/propagation/. NEVER mixed with raw data."
selected_subset: "Multi-scenario synthetic cascades binding authentic HumAID/CrisisMMD/DFDC identifiers with scale-free Barabási-Albert and small-world Watts-Strogatz topologies."
selection_reason: "Authentic historical social-media repost graphs with unrestricted timestamps and complete deepfake cascades are legally restricted under platform API terms (e.g. X/Twitter ToS). The semi-synthetic generator anchors cascades to REAL crisis/deepfake content IDs while systematically testing organic vs. bot-coordinated amplification."
raw_data_policy: "DO NOT store in data/raw/. All generated data resides in data/generated/propagation/."
derived_data_policy: "Graph vertices, edges, PageRank distributions, and cluster identifiers stored in data/features/propagation/."
validation_status: "VALIDATED"
checksum_policy: "Deterministic SHA256 generated across seed-controlled simulation runs."
notes: "STRICT GOVERNANCE RULE: Must always be labeled as SEMI-SYNTHETIC DATA. Never misrepresent as real-world historical propagation logs."
