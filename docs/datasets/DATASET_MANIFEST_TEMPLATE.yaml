# ==============================================================================
# CrisisGuard Dataset Manifest Specification Template
# Every dataset in CrisisGuard must have a corresponding manifest file
# registered in docs/datasets/<dataset_name>_manifest.yaml prior to ingestion.
# ==============================================================================

dataset_name: "example_dataset_name"
version: "1.0.0"
category: "crisis_information | synthetic_media | road_network | propagation_graph"
provenance_classification: "REAL | DERIVED | SEMI-SYNTHETIC"

source:
  canonical_url: "https://example.org/dataset"
  access_url: "https://example.org/dataset/download"
  documentation_url: "https://example.org/dataset/docs"
  access_type: "OPEN_ACCESS | ACCESS_REQUIRED | RESEARCH_AGREEMENT"
  access_instructions: "Instructions on how access is requested or granted."
  access_date: "YYYY-MM-DD"

licensing:
  license_name: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
  commercial_use_allowed: false
  redistribution_allowed: false
  attribution_required: true
  terms_summary: "Academic and research evaluation only."

storage:
  raw_directory: "data/raw/example_dataset_name"
  expected_file_types:
    - ".csv"
    - ".json"
    - ".tsv"
  expected_structure:
    - "data/raw/example_dataset_name/metadata.csv"
    - "data/raw/example_dataset_name/annotations/"

validation:
  checksum_type: "SHA256"
  expected_checksum: "optional_sha256_hash_here"
  expected_record_count: 0
  expected_disk_size_bytes: 0
  status: "NOT_DOWNLOADED | DOWNLOADED | VERIFIED | CORRUPT"

pipeline_role:
  consumer_stage: "preprocessing | kafka_producer | graphx_builder | mllib_features"
  role_description: "Explicit role and purpose of this dataset within the CrisisGuard pipeline."
